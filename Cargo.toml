[package]
name = "starkom-gadgets"
version = "4.0.0"
description = "Reusable Starkom chips."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/gadgets.git"
readme = "README.md"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
primitive-types = "0.14.0"
sha3 = "0.12.0"
starkom-bluesky = { version = "3.7.2", optional = true }
starkom-ff = "4.1.0"
starkom-goldilocks = { version = "3.2.1", optional = true }
starkom-pcs = "6.1.1"
starkom-plonk = { path = "../plonk" }
starkom-poseidon = "3.8.2"
starkom-poseidon2 = "6.8.2"
starkom-schraderbrau = { version = "1.1.1", optional = true }

[features]
default = ["bluesky", "goldilocks", "schraderbrau"]
bluesky = [
  "starkom-bluesky",
  "starkom-pcs/bluesky",
  "starkom-poseidon/bluesky",
  "starkom-poseidon2/bluesky",
]
goldilocks = [
  "starkom-goldilocks",
  "starkom-pcs/goldilocks",
  "starkom-poseidon/goldilocks",
  "starkom-poseidon2/goldilocks",
]
schraderbrau = [
  "starkom-schraderbrau",
  "starkom-pcs/schraderbrau",
  "starkom-poseidon/schraderbrau",
  "starkom-poseidon2/schraderbrau",
]
