[package]
name = "starkom-gadgets"
version = "4.0.0"
description = "Reusable Starkom chips."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/gadgets.git"
readme = "README.md"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
primitive-types = "0.14.0"
sha3 = "0.12.0"
starkom-bluesky = { version = "3.9.0", optional = true }
starkom-ff = "4.2.1"
starkom-goldilocks = { version = "3.4.2", optional = true }
starkom-koalabear = { version = "1.4.1", optional = true }
starkom-pcs = { version = "9.0.0", path = "../pcs" }
starkom-plonk = { version = "10.0.0", path = "../plonk" }
starkom-poseidon = "5.1.3"
starkom-poseidon2 = "7.1.2"
starkom-schraderbrau = { version = "1.3.0", optional = true }

[features]
default = ["bluesky", "goldilocks", "schraderbrau", "koalabear"]
bluesky = [
  "starkom-bluesky",
  "starkom-poseidon/bluesky",
  "starkom-poseidon2/bluesky",
]
goldilocks = [
  "starkom-goldilocks",
  "starkom-poseidon/goldilocks",
  "starkom-poseidon2/goldilocks",
]
schraderbrau = [
  "starkom-schraderbrau",
  "starkom-poseidon/schraderbrau",
  "starkom-poseidon2/schraderbrau",
]
koalabear = ["starkom-koalabear", "starkom-poseidon/koalabear"]
