[package]
name = "starkom-gadgets"
version = "3.0.0"
description = "Reusable Starkom chips."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/gadgets.git"
readme = "README.md"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.103"
primitive-types = "0.14.0"
sha3 = "0.12.0"
starkom-bluesky = "3.2.0"
starkom-ff = "2.3.0"
starkom-pcs = "4.1.0"
starkom-plonk = "4.6.2"
starkom-poseidon = "2.0.1"
starkom-poseidon2 = "5.0.0"
